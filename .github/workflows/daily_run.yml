name: InvestOS Daily Run
on:
  schedule:
    - cron: '0 11 * * 1-5'   # 6am Toronto (pre-market)
    - cron: '0 16 * * 1-5'   # 11am Toronto (mid-session)
    - cron: '0 21 * * 1-5'   # 4pm Toronto (after close)
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 deprecation warning
jobs:
  daily-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore ML model cache
        uses: actions/cache@v6.1.0
        with:
          path: ml_model_cache.pkl
          # ml_last_retrain.txt is git-tracked and only changes when ml_retrainer.py
          # actually retrains (weekly gate, RETRAIN_EVERY_DAYS=7) -- hashing it means
          # this key changes exactly when the cached model should be considered
          # stale. On a retrain day this misses, ml_retrainer.py trains a fresh
          # model and ml_engine.py loads it in the same job (already worked before
          # this step existed); actions/cache then saves it under the new key
          # automatically. On any other day this hits, restoring the model trained
          # at the last retrain so ml_engine.py doesn't retrain from scratch. If the
          # feature set ever changes without a retrain, ml_engine.py's own
          # feature_hash check still catches it and falls back to a fresh,
          # correctly-split retrain -- this key doesn't need to account for that.
          key: ml-model-cache-${{ hashFiles('ml_last_retrain.txt') }}

      - name: Run InvestOS daily analysis
        run: python run_daily.py --github
        env:
          NGN_MARKETS_KEY: ${{ secrets.NGN_MARKETS_KEY }}

      - name: Commit updated dashboard
        run: |
          git config --global user.name "InvestOS Bot"
          git config --global user.email "investos-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Brief $(date +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
