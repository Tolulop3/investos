name: Invariant Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run invariant tests
        run: pytest tests/test_invariants.py -v --tb=short

      - name: Run standalone unit tests
        # Run as a separate pytest process from the invariant suite above: these files
        # stub sys.modules["numpy"/"sklearn"/"pandas"] at import time so they can run
        # without those deps installed, which would poison a shared pytest process.
        run: pytest test_account_sizing.py test_gate_engine.py test_safe_parse_records.py -v --tb=short
