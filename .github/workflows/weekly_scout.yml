name: Weekly Scout

on:
  schedule:
    - cron: '0 10 * * 0'   # Sunday 10 AM UTC = 6 AM ET
  workflow_dispatch:         # Manual trigger for testing

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scout agent
        run: python scout_agent.py
        env:
          NGN_MARKETS_KEY: ${{ secrets.NGN_MARKETS_KEY }}

      - name: Commit updated universe
        run: |
          git config --global user.name "InvestOS Scout"
          git config --global user.email "investos@bot.local"
          git add universe_current.json universe_dynamic.json universe_rotation_log.json global_watch.json
          git diff --cached --quiet || git commit -m "Scout $(date -u '+%Y-%m-%d'): universe updated"
          # Retry on push rejection -- see daily_run.yml's matching comment.
          # Lower collision risk here (weekly cadence, no overlap with the
          # daily workflows) but kept consistent for the same robustness.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $i/5) — retrying after rebase..."
            sleep $((RANDOM % 10 + 5))
            if [ "$i" -eq 5 ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
