name: InvestOS Strategist Agent

on:
  # 30 min after each daily run (6:30am, 11:30am, 4:30pm Toronto)
  schedule:
    - cron: '30 11 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

# Shared with daily_run.yml and pattern_agent.yml — serialises repo commits
# across all three so their push steps don't race. (Finding 24, 2026-08-29 audit.)
concurrency:
  group: investos-main-commit
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"   # see daily_run.yml's matching comment

jobs:
  strategist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategist agent
        run: python strategist_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit research note
        run: |
          git config --global user.name "InvestOS Bot"
          git config --global user.email "investos-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Research $(date +'%Y-%m-%d %H:%M') UTC"
          # Retry on push rejection -- see daily_run.yml's matching comment.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $i/5) — retrying after rebase..."
            sleep $((RANDOM % 10 + 5))
            if [ "$i" -eq 5 ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
