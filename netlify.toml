[build]
  functions = "netlify/functions"
  # Credit-bleed fix (2026-07-28): 18 deploys this billing period consumed
  # 270/300 credits (~99.9% of spend), while function invocations/bandwidth/
  # compute stayed near-zero — this was a build-trigger problem, not a
  # bot-traffic problem. Every push to main (up to 9/weekday from the
  # automated Brief/Patterns/Research workflows) was triggering a full
  # rebuild regardless of whether anything Netlify actually serves changed.
  # Skip the build unless netlify/ or netlify.toml changed. ignore exits
  # 0 -> skip build, non-zero -> proceed. The `-n "$CACHED_COMMIT_REF"`
  # guard forces a build when there's no prior deploy to diff against
  # (e.g. site reconnected), rather than letting an empty ref silently
  # skip. netlify.toml is in the watched path list, so the deploy that
  # introduces this rule always fires.
  # 2026-10-25 tightening: index.html REMOVED from the watched paths.
  # Measured again that day: 11 production deploys = 165 of 165.5 credits
  # consumed in the new cycle's first day (flat 15/deploy; functions,
  # bandwidth and requests are ~free at this volume). The dashboard bake
  # rewrites index.html 3x/weekday, so watching it means ~66 deploys/mo
  # ~= 990 credits against a 300-credit free budget — the July fix could
  # never have held. This site exists for the ticker function; the
  # Netlify-hosted dashboard copy is a duplicate of the canonical GitHub
  # Pages dashboard and may go stale between function deploys (accepted).
  # To ship a dashboard-code change here: manual deploy, or touch this
  # file in the same push.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml'

# ── Security headers on all pages ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "no-referrer"
    Permissions-Policy         = "geolocation=(), camera=(), microphone=()"

# ── API routes: restricted CORS ──────────────────────────────────────────────
# Access-Control-Allow-Origin is set per-request by ticker.js (echoes the
# caller's origin if it's in ALLOWED_ORIGINS) — a single static value here
# can't express two allowed origins (Netlify site + GitHub Pages dashboard).
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, x-investos-key"

[[redirects]]
  from   = "/api/ticker"
  to     = "/.netlify/functions/ticker"
  status = 200

# ── Publish scoping (2026-10-25) ────────────────────────────────────────────
# No publish dir is configured, so Netlify serves the whole repo root. The
# repo is public on GitHub, so today this is zero incremental exposure —
# these forced 404s exist so a future private repo (or a sensitive file
# committed by accident) doesn't leak through this domain. The dashboard's
# data files (root *.json), index.html and signal_ledger.html stay public:
# the Netlify-hosted dashboard copy needs them. Function invocation is not
# affected — it routes via /.netlify/functions/* and /api/*, not /netlify/*.
# NOTE: extension splats ("/*.py") do NOT match in Netlify's redirect
# engine (verified live 2026-10-25) — root files are blocked by exact path.
# New root .py files must be added here to stay blocked.
[[redirects]]
  from   = "/netlify/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/tests/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/scripts/*"
  to     = "/404.html"
  status = 404
  force  = true

